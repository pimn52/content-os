<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W28 主旁白 UI 模拟验证</title></head>
<body><div id="root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { EvaluationMasterPanel } from '../src/EvaluationMasterPanel.tsx';
import '../src/styles.css';
window.fixtureCalls=[];
const copy='有观点不等于有表达。先明确想解决的问题，再选择能够支撑观点的事实和画面。';
const storageKey='w28-synthetic-run';
const saved=()=>JSON.parse(localStorage.getItem(storageKey)||'[]');
const value=()=>({id:'synthetic-run',project_id:'synthetic-project',created_at:'2026-10-12T00:00:00Z',status:'evaluation_master_bound',waiting_stop_reasons:['evaluation_talking_execution_not_integrated','evaluation_render_execution_not_integrated'],evaluation_master:{current_eligible:true,whole_run_ready:false,audio_id:'synthetic-audio',copy,duration_ms:5640}});
async function request(path,options){
  window.fixtureCalls.push({path,body:options?.body?JSON.parse(options.body):null});
  if(path.endsWith('/candidates'))return [{audio_id:'synthetic-audio',text:copy,duration_ms:5640,reviewed_at:'2026-10-12',human_approved:true,current_review_eligible:true,reasons:[]}];
  if(path.endsWith('/admissions'))return [{id:'synthetic-admission',project_id:'synthetic-project',created_at:'2026-10-12',revoked_at:null,review:{selection:{audio_id:'synthetic-audio'},intended_activity:'仅本方案原音频主旁白引用（模拟许可）'}}];
  if(path.endsWith('/preflight'))return {project_id:'synthetic-project',audio_id:'synthetic-audio',master_stage_eligible:true,whole_run_ready:false,reasons:[],downstream_reasons:['evaluation_talking_execution_not_integrated','evaluation_render_execution_not_integrated'],fingerprint:'synthetic-fingerprint'};
  if(path.split('?')[0].endsWith('/access'))return {audio_id:'synthetic-audio',state:'blocked',reasons:['模拟验证不提供媒体字节'],manifest:{lineage:'known',scopes:[{purpose:'internal_evaluation'}]}};
  if(path.endsWith('/runs')&&options?.method==='POST'){localStorage.setItem(storageKey,JSON.stringify([value()]));return value();}
  if(path.endsWith('/runs'))return saved();
  if(path.endsWith('/cancel')){const v={...value(),status:'cancelled',evaluation_master:{...value().evaluation_master,current_eligible:false}};localStorage.setItem(storageKey,JSON.stringify([v]));return v;}
  return saved()[0];
}
createRoot(document.getElementById('root')).render(React.createElement('main',{className:'card',style:{maxWidth:880,margin:'32px auto',padding:20}},
  React.createElement('p',null,'隔离的模拟 UI：不使用真实项目、不生成媒体、不证明真实制作准入。'),
  React.createElement(EvaluationMasterPanel,{projectId:'synthetic-project',draftVersion:1,scriptRevision:1,draftDirty:false,styleTokens:{},request})));
</script></body></html>
